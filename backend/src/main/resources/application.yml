# PLACEHOLDER VALUES - NOT MEDICAL GUIDANCE.
# These numbers are made up so the rule engine can be built and tested.
# The real thresholds will be set by the doctor. Do not present these as clinical rules.
results-line:
  claude:
    # The API key is read from the ANTHROPIC_API_KEY environment variable, never from this file.
    model: claude-opus-5-5
    # Thinking tokens count toward this limit, so keep it generous.
    max-tokens: 4096
    # true = canned keyword replies instead of calling Claude (for building the screen without a key).
    # The UI shows a banner when this is on. Set false to use the real Claude.
    demo-mode: false
  interval-rules:
    tiers:
      - min-polyps: 0
        interval-years: 10
      - min-polyps: 5
        interval-years: 3
