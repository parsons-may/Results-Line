server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The browser only talks to this server; API calls are forwarded to the backend container.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
