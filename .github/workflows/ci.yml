name: CI

# Runs the tests on every push and pull request. No secrets are used and no real Claude calls are made.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        run: mvn -B test
        working-directory: backend

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  docker:
    name: Docker Compose smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start in demo mode (no API key)
        run: docker compose up -d
        env:
          DEMO_MODE: "true"
      - name: Wait for the app and check the API through the frontend proxy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/info | grep -q '"demoMode":true'; then
              echo "App is up in demo mode"
              exit 0
            fi
            sleep 3
          done
          echo "App did not come up" >&2
          exit 1
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down
